spring.application.name=ms-edututor-notify

# Nodos del clúster RabbitMQ (host:puerto separados por coma): si el primero
# cae, el cliente se reconecta al siguiente. Sin RABBITMQ_ADDRESSES usa
# RABBITMQ_HOST/RABBITMQ_PORT, como antes (un solo nodo).
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Colas que consume cada dominio. Mismos nombres que declara rabbitmq-admin.
edututor.rabbit.email.queue=q.cmd.email
edututor.rabbit.session.queue=q.cmd.session
edututor.rabbit.certificate.queue=q.cmd.certificate
